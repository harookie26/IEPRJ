actions:
  - !animation
    targetAnimatorId: CinematicBarsAnimator
    animationTrigger: show

  - !wait {}
  - !dialogue
    characterName: Adam
    dialogueLine: Where am I? Why is everything pixelated?
  - !dialogue
    characterName: Mysterious Voice
    dialogueLine: Adam? Why are you here?
  - !dialogue
    characterName: Adam
    dialogueLine: Who are you?
  - !dialogue
    characterName: Adam
    dialogueLine: I just played the arcade because something is happening to it, I came to the house just to investigate it.
  - !dialogue
    characterName: Mysterious Voice
    dialogueLine: You’re like US now, stuck in this game, but you still have your body.
  - !dialogue
    characterName: Mysterious Voice
    dialogueLine: You should save me and let me out of this game through that door behind you where you came from.
  - !dialogue
    characterName: Adam
    dialogueLine: US? HOW MANY are you out there?
  - !dialogue
    characterName: Mysterious Voice
    dialogueLine: There’s no time to explain, come find me and get me out of here.
  - !dialogue
    characterName: Mysterious Voice
    dialogueLine: Navigate this wretched place by holding A to move left or D to move right.
  
  - !animation
    targetAnimatorId: CinematicBarsAnimator
    animationTrigger: hide


