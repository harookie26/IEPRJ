actions:
  - !wait {}
  - !dialogue
    characterName: Steve
    dialogueLine: Thank you, Adam. I feel... lighter... and complete.
  - !dialogue
    characterName: Adam
    dialogueLine: Okay, you're finally back. Time to leave this place!
  - !dialogue
    characterName: Adam
    dialogueLine: Wait… where are you, Steve?
  - !dialogue
    characterName: Steve
    dialogueLine: I guess it was just my soul stuck in the game, Adam.
  - !dialogue
    characterName: Steve
    dialogueLine: Thank you for setting me free. I can now rest in peace.
  - !dialogue
    characterName: Steve
    dialogueLine: Go save the others... there's more of us trapped in these machines.
  - !dialogue
    characterName: Adam
    dialogueLine: Steve... I will. I promise.
